ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    reset_on_time_jump: true

    # --- FRAMES ---
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link  # Match your reference file!
    world_frame: odom

     # -------- SENSOR 1: WHEELS --------
    odom0: /odom
    
    # TRUST: Vx (forward speed) and vYaw (turning speed) ONLY
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]

    # -------- SENSOR 2: IMU --------
    imu0: /imu
    
    # TRUST: Absolute Yaw (orientation) and vYaw (turning speed)
    imu0_config: [false, false, false,
                  false, false, true,    # <--- Changed to TRUE
                  false, false, false,
                  false, false, true,
                  false, false, false]

    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 7
